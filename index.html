<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Heart Rate Triggered Camera</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background: #121212; color: #fff; height: 100vh; display: flex; flex-direction: column; }
    
    .viewport {
      position: relative;
      flex: 1;
      width: 100%;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video, #capturedImage {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #capturedImage {
      position: absolute;
      top: 0; left: 0;
      display: none;
    }

    .hud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.6);
      padding: 12px 18px;
      border-radius: 24px;
      backdrop-filter: blur(8px);
    }
    .metric { display: flex; flex-direction: column; }
    .metric-label { font-size: 11px; text-transform: uppercase; color: #aaa; }
    .metric-val { font-size: 24px; font-weight: bold; }
    .bpm-highlight { color: #ff4757; }

    .controls {
      background: #1e1e1e;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-top-left-radius: 16px;
      border-top-right-radius: 16px;
    }
    .input-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    input[type="number"] {
      width: 80px;
      padding: 8px;
      font-size: 18px;
      text-align: center;
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      border-radius: 8px;
    }
    button {
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    .btn-connect { background: #2ed573; color: #000; }
    .btn-download { background: #ffa502; color: #000; display: none; }
    .btn-reset { background: #1e90ff; color: #fff; display: none; }
    .action-group { display: flex; gap: 10px; }
    .action-group button { flex: 1; }
    .status-text { text-align: center; font-size: 13px; color: #888; }
  </style>
</head>
<body>

  <div class="viewport">
    <video id="cameraPreview" autoplay playsinline muted></video>
    <img id="capturedImage" alt="Captured Frame" />
    
    <div class="hud">
      <div class="metric">
        <span class="metric-label">Heart Rate</span>
        <span class="metric-val bpm-highlight"><span id="bpmDisplay">--</span> BPM</span>
      </div>
      <div class="metric" style="text-align: right;">
        <span class="metric-label">Status</span>
        <span class="metric-val" id="stateDisplay" style="font-size: 16px;">DISARMED</span>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="input-row">
      <label for="targetInput">Target BPM (Hit or Pass-Through):</label>
      <input type="number" id="targetInput" value="110" min="40" max="220" />
    </div>

    <button id="connectBtn" class="btn-connect">Connect Watch & Start Camera</button>
    
    <div class="action-group">
      <button id="downloadBtn" class="btn-download">Download Image</button>
      <button id="resetBtn" class="btn-reset">Reset & Arm Next</button>
    </div>

    <p id="statusMsg" class="status-text">Set target, then connect to begin.</p>
  </div>

  <canvas id="snapshotCanvas" style="display: none;"></canvas>

  <script>
    const video = document.getElementById('cameraPreview');
    const capturedImg = document.getElementById('capturedImage');
    const canvas = document.getElementById('snapshotCanvas');
    const bpmDisplay = document.getElementById('bpmDisplay');
    const stateDisplay = document.getElementById('stateDisplay');
    const statusMsg = document.getElementById('statusMsg');
    const targetInput = document.getElementById('targetInput');
    const connectBtn = document.getElementById('connectBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const resetBtn = document.getElementById('resetBtn');

    let currentBpm = null;
    let previousBpm = null;
    let isArmed = false;
    let latestDataUrl = null;

    // Check secure environment early
    window.addEventListener('DOMContentLoaded', () => {
      if (!window.isSecureContext) {
        statusMsg.innerText = 'Requires HTTPS or localhost.';
      } else if (!navigator.bluetooth) {
        statusMsg.innerText = 'Web Bluetooth not supported in this browser. Use Chrome on Android.';
      }
    });

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        video.srcObject = stream;
        video.setAttribute('playsinline', '');
        video.setAttribute('webkit-playsinline', '');
        await video.play();
      } catch (err) {
        statusMsg.innerText = 'Camera error: ' + err.message;
        console.error(err);
      }
    }

    async function connectWatch() {
      try {
        statusMsg.innerText = 'Scanning for Pixel Watch...';
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ services: ['heart_rate'] }]
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService('heart_rate');
        const characteristic = await service.getCharacteristic('heart_rate_measurement');

        await characteristic.startNotifications();
        characteristic.addEventListener('characteristicvaluechanged', handleHeartRateData);

        connectBtn.style.display = 'none';
        isArmed = true;
        updateState('ARMED', '#2ed573');
        statusMsg.innerText = `Armed. Waiting to hit/cross ${targetInput.value} BPM...`;
      } catch (err) {
        statusMsg.innerText = 'BLE Connection failed: ' + err.message;
        console.error(err);
      }
    }

    function handleHeartRateData(event) {
      const value = event.target.value;
      const flags = value.getUint8(0);
      const is16Bit = (flags & 0x01) !== 0;
      
      const newBpm = is16Bit ? value.getUint16(1, true) : value.getUint8(1);
      bpmDisplay.innerText = newBpm;

      const target = parseInt(targetInput.value, 10);

      if (isArmed) {
        // Trigger condition 1: Exact hit
        const exactHit = (newBpm === target);

        // Trigger condition 2: Pass-through (jumped over the target while rising or falling)
        let passedThrough = false;
        if (previousBpm !== null) {
          const crossedGoingUp = (previousBpm < target && newBpm > target);
          const crossedGoingDown = (previousBpm > target && newBpm < target);
          passedThrough = crossedGoingUp || crossedGoingDown;
        }

        if (exactHit || passedThrough) {
          currentBpm = newBpm;
          triggerShutter();
        }
      }

      previousBpm = newBpm;
      currentBpm = newBpm;
    }

    function triggerShutter() {
      isArmed = false;
      updateState('TRIGGERED', '#ffa502');

      // Capture frame to canvas
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // Clean metadata Stamp: Render only current BPM & timestamp (no debug triggers)
      ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
      ctx.fillRect(20, canvas.height - 70, 180, 50);
      ctx.fillStyle = '#ffffff';
      ctx.font = '22px sans-serif';
      ctx.fillText(`${currentBpm} BPM`, 35, canvas.height - 38);

      latestDataUrl = canvas.toDataURL('image/jpeg', 0.95);
      capturedImg.src = latestDataUrl;
      capturedImg.style.display = 'block';

      updateState('CAPTURED', '#ff4757');
      statusMsg.innerText = `Photo taken at ${currentBpm} BPM!`;
      
      downloadBtn.style.display = 'block';
      resetBtn.style.display = 'block';
    }

    // Download action
    downloadBtn.addEventListener('click', () => {
      if (!latestDataUrl) return;
      const link = document.createElement('a');
      link.href = latestDataUrl;
      link.download = `heart_rate_${currentBpm}bpm_${Date.now()}.jpg`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    // Reset action
    resetBtn.addEventListener('click', () => {
      capturedImg.style.display = 'none';
      downloadBtn.style.display = 'none';
      resetBtn.style.display = 'none';
      
      // Update baseline to current BPM to prevent instant trigger on same frame
      previousBpm = currentBpm;
      isArmed = true;
      updateState('ARMED', '#2ed573');
      statusMsg.innerText = `Armed. Waiting to hit/cross ${targetInput.value} BPM...`;
    });

    connectBtn.addEventListener('click', async () => {
      await startCamera();
      await connectWatch();
    });

    function updateState(text, color) {
      stateDisplay.innerText = text;
      stateDisplay.style.color = color;
    }
  </script>
</body>
</html>
