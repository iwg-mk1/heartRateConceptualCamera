<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Heart Rate Camera Suite</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background: #121212; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Top Navigation Tabs */
    nav {
      display: flex;
      background: #1c1c1e;
      border-bottom: 1px solid #2c2c2e;
      z-index: 20;
    }
    .tab-btn {
      flex: 1;
      padding: 14px 10px;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: none;
      background: transparent;
      color: #8e8e93;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      color: #30d158;
      border-bottom-color: #30d158;
    }

    /* Viewport Area */
    .viewport {
      position: relative;
      flex: 1;
      width: 100%;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #targetCapturedImage {
      position: absolute;
      top: 0; 
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: none;
    }

    /* Live HUD */
    .hud {
      position: absolute;
      top: 16px; left: 16px; right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.65);
      padding: 12px 18px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      z-index: 10;
    }
    .metric { display: flex; flex-direction: column; }
    .metric-label { font-size: 11px; text-transform: uppercase; color: #a1a1a6; }
    .metric-val { font-size: 22px; font-weight: 700; }
    .bpm-val { color: #ff453a; }

    /* Control Sheet */
    .controls-panel {
      background: #1c1c1e;
      padding: 16px 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-top: 1px solid #2c2c2e;
      z-index: 20;
    }
    .page-view { display: none; flex-direction: column; gap: 12px; }
    .page-view.active { display: flex; }

    .input-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    input[type="number"] {
      width: 80px;
      padding: 8px;
      font-size: 18px;
      text-align: center;
      background: #2c2c2e;
      color: #fff;
      border: 1px solid #3a3a3c;
      border-radius: 8px;
    }

    /* Orientation Toggle Selector */
    .segmented-control {
      display: flex;
      background: #2c2c2e;
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }
    .segmented-btn {
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      background: transparent;
      color: #8e8e93;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .segmented-btn.active {
      background: #636366;
      color: #fff;
    }

    button.action-btn {
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    .btn-connect { background: #30d158; color: #000; }
    .btn-download { background: #ff9f0a; color: #000; }
    .btn-reset { background: #0a84ff; color: #fff; }
    .btn-record { background: #ff453a; color: #fff; }
    .btn-stop { background: #ffd60a; color: #000; }
    
    .btn-row { display: flex; gap: 10px; }
    .btn-row button { flex: 1; }
    .status-text { text-align: center; font-size: 13px; color: #8e8e93; }

    /* Session Results Modal */
    #resultsModal {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(10px);
      display: none;
      flex-direction: column;
      padding: 20px;
      overflow-y: auto;
      z-index: 30;
    }
    #resultsModal h2 { font-size: 18px; margin-bottom: 14px; text-align: center; }
    .gallery-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 20px;
    }
    .result-card {
      background: #1c1c1e;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2c2c2e;
      display: flex;
      flex-direction: column;
    }
    .result-card img { 
      width: 100%; 
      height: auto; 
      object-fit: contain;
      display: block; 
    }
    .card-meta {
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-meta .title { font-weight: bold; font-size: 15px; }
    .card-meta button {
      padding: 8px 14px;
      background: #0a84ff;
      border: none;
      color: #fff;
      font-weight: 600;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Tabs -->
  <nav>
    <button class="tab-btn active" id="tabTarget" onclick="switchPage('target')">Target BPM</button>
    <button class="tab-btn" id="tabSession" onclick="switchPage('session')">Session (Min/Med/Max)</button>
  </nav>

  <!-- Viewport Area -->
  <div class="viewport">
    <video id="cameraPreview" autoplay playsinline muted></video>
    <img id="targetCapturedImage" alt="Captured Frame" />

    <div class="hud">
      <div class="metric">
        <span class="metric-label">Heart Rate</span>
        <span class="metric-val bpm-val"><span id="bpmDisplay">--</span> BPM</span>
      </div>
      <div class="metric" style="text-align: right;">
        <span class="metric-label">Status</span>
        <span class="metric-val" id="stateDisplay" style="font-size: 15px;">DISARMED</span>
      </div>
    </div>

    <!-- Results Modal for Session Analysis -->
    <div id="resultsModal">
      <h2>Session Summary (Min / Median / Max)</h2>
      <div class="gallery-grid" id="galleryContainer"></div>
      <button class="action-btn btn-reset" onclick="closeResults()">Done / Clear Session</button>
    </div>
  </div>

  <!-- Bottom Controls -->
  <div class="controls-panel">
    <!-- Global Connect Button -->
    <button id="connectBtn" class="action-btn btn-connect" onclick="initHardware()">Connect Pixel Watch & Camera</button>

    <!-- Caption Orientation Selector -->
    <div class="input-row">
      <span style="font-size: 14px; color: #aaa;">Caption Layout:</span>
      <div class="segmented-control">
        <button class="segmented-btn active" id="btnPortrait" onclick="setOrientation('portrait')">Portrait</button>
        <button class="segmented-btn" id="btnLandscape" onclick="setOrientation('landscape')">Landscape</button>
      </div>
    </div>

    <!-- Page 1: Target Mode -->
    <div id="pageTarget" class="page-view active">
      <div class="input-row">
        <label for="targetInput">Trigger Target BPM:</label>
        <input type="number" id="targetInput" value="110" min="40" max="220" />
      </div>

      <div class="btn-row" id="targetActionGroup" style="display: none;">
        <button id="downloadTargetBtn" class="action-btn btn-download">Download Image</button>
        <button id="resetTargetBtn" class="action-btn btn-reset">Reset & Arm</button>
      </div>
    </div>

    <!-- Page 2: Session Mode -->
    <div id="pageSession" class="page-view">
      <div class="btn-row">
        <button id="recordBtn" class="action-btn btn-record" onclick="toggleSessionRecording()" disabled>Start Session Recording</button>
      </div>
      <p id="sessionStats" class="status-text" style="color: #ff9f0a;">Recorded frames: 0</p>
    </div>

    <p id="statusMsg" class="status-text">Tap Connect to begin.</p>
  </div>

  <canvas id="snapshotCanvas" style="display: none;"></canvas>

  <script>
    const video = document.getElementById('cameraPreview');
    const targetImg = document.getElementById('targetCapturedImage');
    const canvas = document.getElementById('snapshotCanvas');
    const bpmDisplay = document.getElementById('bpmDisplay');
    const stateDisplay = document.getElementById('stateDisplay');
    const statusMsg = document.getElementById('statusMsg');
    const connectBtn = document.getElementById('connectBtn');
    
    // Target Controls
    const targetInput = document.getElementById('targetInput');
    const targetActionGroup = document.getElementById('targetActionGroup');
    const downloadTargetBtn = document.getElementById('downloadTargetBtn');
    const resetTargetBtn = document.getElementById('resetTargetBtn');

    // Session Controls
    const recordBtn = document.getElementById('recordBtn');
    const sessionStats = document.getElementById('sessionStats');
    const resultsModal = document.getElementById('resultsModal');
    const galleryContainer = document.getElementById('galleryContainer');

    // State Variables
    let activePage = 'target';
    let hardwareReady = false;
    let currentBpm = null;
    let previousBpm = null;
    let isTargetArmed = false;
    let latestTargetDataUrl = null;
    let captionOrientation = 'portrait';

    // Session Buffer
    let isSessionRecording = false;
    let sessionBuffer = [];

    function setOrientation(mode) {
      captionOrientation = mode;
      document.getElementById('btnPortrait').classList.toggle('active', mode === 'portrait');
      document.getElementById('btnLandscape').classList.toggle('active', mode === 'landscape');
    }

    // Helper: Draws the BPM badge proportionally with safe-area margins
    // Helper: Draws the BPM badge and physically rotates it 90 degrees in landscape
// Helper: Draws the BPM badge and safely rotates it 90 degrees inside frame boundaries
function drawBpmOverlay(ctx, width, height, bpmText) {
  ctx.save();
  const badgeText = `${bpmText} BPM`;

  // Scale badge font and padding relative to the smallest canvas dimension
  const baseDim = Math.min(width, height);
  const fontSize = Math.max(26, Math.round(baseDim * 0.042));
  ctx.font = `bold ${fontSize}px sans-serif`;

  const textMetrics = ctx.measureText(badgeText);
  const padX = Math.round(fontSize * 0.8);
  const boxWidth = Math.round(textMetrics.width + padX * 2);
  const boxHeight = Math.round(fontSize * 2.0);
  const cornerRadius = Math.round(boxHeight * 0.25);

  // Safe margin inset (8% inward from frame boundary)
  const insetX = Math.round(width * 0.08);
  const insetY = Math.round(height * 0.08);

  if (captionOrientation === 'portrait') {
    // Upright badge pinned to bottom-left
    const x = insetX;
    const y = height - boxHeight - insetY;
    renderRoundedRect(ctx, x, y, boxWidth, boxHeight, cornerRadius);
    ctx.fillStyle = '#ffffff';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillText(badgeText, x + padX, y + boxHeight / 2);
  } else {
    // Landscape: Rotate 90 degrees clockwise along the right edge
    // Origin is shifted so the badge dimensions (boxWidth x boxHeight) remain 100% inside canvas
    const x = width - insetX;
    const y = height - insetY - boxWidth;

    ctx.translate(x, y);
    ctx.rotate(Math.PI / 2);

    // Draw from (0, 0) inside the rotated coordinate matrix
    renderRoundedRect(ctx, 0, 0, boxWidth, boxHeight, cornerRadius);
    ctx.fillStyle = '#ffffff';
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillText(badgeText, padX, boxHeight / 2);
  }

  ctx.restore();
}

    function renderRoundedRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      ctx.fill();
    }

    function switchPage(page) {
      activePage = page;
      document.getElementById('tabTarget').classList.toggle('active', page === 'target');
      document.getElementById('tabSession').classList.toggle('active', page === 'session');
      document.getElementById('pageTarget').classList.toggle('active', page === 'target');
      document.getElementById('pageSession').classList.toggle('active', page === 'session');

      if (page === 'target') {
        targetImg.style.display = latestTargetDataUrl ? 'block' : 'none';
        if (hardwareReady && !latestTargetDataUrl) {
          isTargetArmed = true;
          updateState('ARMED', '#30d158');
        }
      } else {
        targetImg.style.display = 'none';
        if (!isSessionRecording) {
          updateState(hardwareReady ? 'READY' : 'DISARMED', '#8e8e93');
        }
      }
    }

    async function initHardware() {
      try {
        statusMsg.innerText = 'Requesting camera...';
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        video.srcObject = stream;
        video.setAttribute('playsinline', '');
        video.setAttribute('webkit-playsinline', '');
        await video.play();

        statusMsg.innerText = 'Connecting to Pixel Watch...';
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ services: ['heart_rate'] }]
        });
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService('heart_rate');
        const characteristic = await service.getCharacteristic('heart_rate_measurement');

        await characteristic.startNotifications();
        characteristic.addEventListener('characteristicvaluechanged', onHeartRateUpdate);

        hardwareReady = true;
        connectBtn.style.display = 'none';
        recordBtn.disabled = false;

        if (activePage === 'target') {
          isTargetArmed = true;
          updateState('ARMED', '#30d158');
        } else {
          updateState('READY', '#0a84ff');
        }
        statusMsg.innerText = 'Connected. Live telemetry streaming.';
      } catch (err) {
        statusMsg.innerText = 'Init failed: ' + err.message;
        console.error(err);
      }
    }

    function onHeartRateUpdate(event) {
      const value = event.target.value;
      const flags = value.getUint8(0);
      const is16Bit = (flags & 0x01) !== 0;
      const newBpm = is16Bit ? value.getUint16(1, true) : value.getUint8(1);

      bpmDisplay.innerText = newBpm;

      if (activePage === 'target' && isTargetArmed) {
        const target = parseInt(targetInput.value, 10);
        const exactHit = (newBpm === target);
        let passedThrough = false;
        if (previousBpm !== null) {
          passedThrough = (previousBpm < target && newBpm > target) || (previousBpm > target && newBpm < target);
        }

        if (exactHit || passedThrough) {
          currentBpm = newBpm;
          triggerTargetShutter();
        }
      }

      if (isSessionRecording) {
        captureSessionSample(newBpm);
      }

      previousBpm = newBpm;
      currentBpm = newBpm;
    }

    function triggerTargetShutter() {
      isTargetArmed = false;
      updateState('CAPTURED', '#ff453a');

      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      drawBpmOverlay(ctx, canvas.width, canvas.height, currentBpm);

      latestTargetDataUrl = canvas.toDataURL('image/jpeg', 0.95);
      targetImg.src = latestTargetDataUrl;
      targetImg.style.display = 'block';

      statusMsg.innerText = `Photo taken at ${currentBpm} BPM!`;
      targetActionGroup.style.display = 'flex';
    }

    downloadTargetBtn.addEventListener('click', () => {
      if (!latestTargetDataUrl) return;
      downloadImage(latestTargetDataUrl, `heart_rate_${currentBpm}bpm_${captionOrientation}.jpg`);
    });

    resetTargetBtn.addEventListener('click', () => {
      targetImg.style.display = 'none';
      targetActionGroup.style.display = 'none';
      latestTargetDataUrl = null;
      previousBpm = currentBpm;
      isTargetArmed = true;
      updateState('ARMED', '#30d158');
      statusMsg.innerText = `Armed. Waiting to hit/cross ${targetInput.value} BPM...`;
    });

    function toggleSessionRecording() {
      if (!isSessionRecording) {
        sessionBuffer = [];
        isSessionRecording = true;
        recordBtn.innerText = 'Stop & Find Min / Med / Max';
        recordBtn.className = 'action-btn btn-stop';
        updateState('RECORDING', '#ff453a');
        sessionStats.innerText = 'Recording live frames...';
      } else {
        isSessionRecording = false;
        recordBtn.innerText = 'Start Session Recording';
        recordBtn.className = 'action-btn btn-record';
        updateState('READY', '#0a84ff');
        processSessionData();
      }
    }

    function captureSessionSample(bpm) {
      if (!video.videoWidth) return;

      const memCanvas = document.createElement('canvas');
      memCanvas.width = video.videoWidth;
      memCanvas.height = video.videoHeight;
      const ctx = memCanvas.getContext('2d');
      ctx.drawImage(video, 0, 0, memCanvas.width, memCanvas.height);

      sessionBuffer.push({
        bpm: bpm,
        canvas: memCanvas,
        timestamp: Date.now()
      });

      sessionStats.innerText = `Recorded frames: ${sessionBuffer.length}`;
    }

    function processSessionData() {
      if (sessionBuffer.length === 0) {
        statusMsg.innerText = 'No frames recorded during this session.';
        return;
      }

      const sorted = [...sessionBuffer].sort((a, b) => a.bpm - b.bpm);
      const minItem = sorted[0];
      const maxItem = sorted[sorted.length - 1];
      const medianIndex = Math.floor(sorted.length / 2);
      const medianItem = sorted[medianIndex];

      const results = [
        { title: 'Lowest (Min)', item: minItem },
        { title: 'Median', item: medianItem },
        { title: 'Peak (Max)', item: maxItem }
      ];

      galleryContainer.innerHTML = '';

      results.forEach(res => {
        const c = res.item.canvas;
        const ctx = c.getContext('2d');
        
        drawBpmOverlay(ctx, c.width, c.height, res.item.bpm);

        const dataUrl = c.toDataURL('image/jpeg', 0.95);
        const card = document.createElement('div');
        card.className = 'result-card';
        card.innerHTML = `
          <img src="${dataUrl}" alt="${res.title}" />
          <div class="card-meta">
            <div>
              <div class="title">${res.title}</div>
              <div style="color: #ff453a; font-weight: bold;">${res.item.bpm} BPM</div>
            </div>
            <button onclick="downloadImage('${dataUrl}', '${res.title.replace(/\s+/g, '_')}_${res.item.bpm}bpm.jpg')">Save</button>
          </div>
        `;
        galleryContainer.appendChild(card);
      });

      resultsModal.style.display = 'flex';
    }

    function closeResults() {
      resultsModal.style.display = 'none';
      sessionBuffer = [];
      sessionStats.innerText = 'Recorded frames: 0';
    }

    function downloadImage(dataUrl, filename) {
      const link = document.createElement('a');
      link.href = dataUrl;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function updateState(text, color) {
      stateDisplay.innerText = text;
      stateDisplay.style.color = color;
    }
  </script>
</body>
</html>
